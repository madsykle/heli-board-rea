name: Build APK

# Builds installable APKs on GitHub's runners.
# This is the intended way to build the fork: the maintainer works from Termux,
# where the Android/Gradle toolchain is not available.
#
# The build fails if the privacy guard detects a network or personal-data
# permission in the merged manifest, or if OS backup was re-enabled.
#
# Signing: if the KEYSTORE_BASE64 secret is set, a properly signed release APK
# and a signed "labs" variant (same key, applicationId suffix .labs, label
# "HeliBoard Labs") are built as well, so successive builds install over each
# other and labs can be installed next to the main app. Without it, only the
# debug-signed APK is produced (throwaway key -> uninstall to update).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;28.0.13004108'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Fails the build if a merged manifest declares INTERNET, contacts,
      # location or similar, or if android:allowBackup is not "false".
      - name: Privacy guard
        run: ./gradlew privacyGuardDebugNoMinify privacyGuardRelease privacyGuardLabs --stacktrace

      # The parser/scoring test uses only synthetic n-grams, never the private model file.
      - name: Run Labs shadow model tests
        run: ./gradlew testLabsUnitTest --tests helium314.keyboard.latin.LabsShadowModelTest --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "$GITHUB_WORKSPACE/rea-release.jks"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "Keystore decoded: $(stat -c%s "$GITHUB_WORKSPACE/rea-release.jks") bytes"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_BASE64 is not set - skipping the signed release APK."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebugNoMinify --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: heliboard-rea-debug
          path: app/build/outputs/apk/debugNoMinify/*.apk
          if-no-files-found: error

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          REA_KEYSTORE_PATH: ${{ github.workspace }}/rea-release.jks
          REA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          REA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          REA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release APK signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk)
          echo "Checking $APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$APK"

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: heliboard-rea-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Labs variant: same code, same signing key, applicationId suffix .labs,
      # label "HeliBoard Labs". Installs next to the main app, so a build under
      # test can be tried without touching the daily keyboard.
      - name: Build signed Labs APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          REA_KEYSTORE_PATH: ${{ github.workspace }}/rea-release.jks
          REA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          REA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          REA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleLabs --stacktrace

      - name: Verify Labs APK signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/labs/*.apk)
          echo "Checking $APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$APK"

      - name: Upload Labs APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: heliboard-rea-labs
          path: app/build/outputs/apk/labs/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: reports
          path: '*/build/reports'
