name: Build APK

# Builds an installable, debug-signed APK on GitHub's runners.
# This is the intended way to build the fork: the maintainer works from Termux,
# where the Android/Gradle toolchain is not available.
#
# The build fails if the privacy guard detects a network or personal-data
# permission in the merged manifest, or if OS backup was re-enabled.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;28.0.13004108'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Fails the build if the merged manifest declares INTERNET, contacts,
      # location or similar, or if android:allowBackup is not "false".
      - name: Privacy guard
        run: ./gradlew privacyGuardDebugNoMinify --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebugNoMinify --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heliboard-rea-debug
          path: app/build/outputs/apk/debugNoMinify/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: reports
          path: '*/build/reports'
